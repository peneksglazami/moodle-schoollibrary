name: Development task
description: A small, independently verifiable School Library change
title: "[Development] "
body:
  - type: textarea
    id: problem
    attributes: {label: Problem / feature, description: What user or engineering problem is addressed?}
    validations: {required: true}
  - type: input
    id: requirements
    attributes: {label: Relevant requirements sections, placeholder: "docs/TZ.md sections ..."}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: Scope}
    validations: {required: true}
  - type: textarea
    id: out-of-scope
    attributes: {label: Out of scope}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, description: Use independently verifiable checkboxes.}
    validations: {required: true}
  - type: textarea
    id: phpunit
    attributes: {label: Required PHPUnit tests}
  - type: textarea
    id: behat
    attributes: {label: Required Behat tests}
  - type: textarea
    id: browser
    attributes: {label: Manual/browser verification}
  - type: textarea
    id: compatibility
    attributes: {label: Moodle 4.4.1 compatibility considerations, description: Identify APIs and exact-release validation needed.}
    validations: {required: true}
