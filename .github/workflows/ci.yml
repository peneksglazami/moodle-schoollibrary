name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # moodle-plugin-ci passes this value to `git clone --branch`, which requires
  # a branch or tag name. The annotated v4.4.1 tag resolves to the immutable
  # commit recorded in dev/versions.env.
  MOODLE_BRANCH: v4.4.1
jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - run: find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
  phpunit:
    name: phpunit-moodle-4.4.1
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        # moodle-plugin-ci creates the test database itself. Only pre-create the
        # administrative database so its CREATE DATABASE command cannot collide.
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, intl, mbstring, soap, zip, gd
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install moodle-plugin-ci
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci "$RUNNER_TEMP/moodle-plugin-ci" ^4
          echo "$RUNNER_TEMP/moodle-plugin-ci/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/moodle-plugin-ci/vendor/bin" >> "$GITHUB_PATH"
      - run: moodle-plugin-ci install --plugin="$GITHUB_WORKSPACE" --db-type=pgsql --db-host=127.0.0.1 --db-name=schoollibrary --db-user=postgres --db-pass=postgres
      - name: Verify exact Moodle checkout
        shell: bash
        run: |
          source dev/versions.env
          actualrelease="$(php dev/read-moodle-release.php "$MOODLE_DIR/version.php")"
          actualref="$(git -C "$MOODLE_DIR" rev-parse HEAD)"
          printf 'Expected Moodle release: %s\nActual Moodle release:   %s\n' "$MOODLE_RELEASE" "$actualrelease"
          printf 'Expected Moodle commit:  %s\nActual Moodle commit:    %s\n' "$MOODLE_GIT_REF" "$actualref"
          test "$actualrelease" = "$MOODLE_RELEASE"
          test "$actualref" = "$MOODLE_GIT_REF"
      - run: moodle-plugin-ci phplint && moodle-plugin-ci phpcs && moodle-plugin-ci phpdoc && moodle-plugin-ci validate && moodle-plugin-ci phpunit
  behat:
    name: behat-moodle-4.4.1
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        # moodle-plugin-ci creates the test database itself. Only pre-create the
        # administrative database so its CREATE DATABASE command cannot collide.
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      selenium:
        image: selenium/standalone-chrome:latest
        ports: ['4444:4444']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, intl, mbstring, soap, zip, gd
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install moodle-plugin-ci
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci "$RUNNER_TEMP/moodle-plugin-ci" ^4
          echo "$RUNNER_TEMP/moodle-plugin-ci/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/moodle-plugin-ci/vendor/bin" >> "$GITHUB_PATH"
      - run: moodle-plugin-ci install --plugin="$GITHUB_WORKSPACE" --db-type=pgsql --db-host=127.0.0.1 --db-name=schoollibrary --db-user=postgres --db-pass=postgres
      - name: Verify exact Moodle checkout
        shell: bash
        run: |
          source dev/versions.env
          actualrelease="$(php dev/read-moodle-release.php "$MOODLE_DIR/version.php")"
          actualref="$(git -C "$MOODLE_DIR" rev-parse HEAD)"
          printf 'Expected Moodle release: %s\nActual Moodle release:   %s\n' "$MOODLE_RELEASE" "$actualrelease"
          printf 'Expected Moodle commit:  %s\nActual Moodle commit:    %s\n' "$MOODLE_GIT_REF" "$actualref"
          test "$actualrelease" = "$MOODLE_RELEASE"
          test "$actualref" = "$MOODLE_GIT_REF"
      - run: moodle-plugin-ci behat --tags=@mod_schoollibrary
